# ─────────────────────────────────────────────────────────────
#  Render deployment for the Taif School Management System.
#
#  This runs the Express server (src/server.js) as a web service.
#  It does NOT run the Electron desktop build — `npm start` is for
#  the desktop app, so the start command below calls node directly.
#
#  Setup: Render Dashboard → New → Blueprint → pick this repo.
#  Render reads this file automatically. Then set the two secret
#  env vars (DATABASE_URL, JWT_SECRET) when prompted.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: taif-school-system
    runtime: node
    plan: free
    branch: main
    # Puppeteer downloads Chromium into ~/.cache by default, and Render does
    # not carry the home directory from the build into the running service —
    # which is why WhatsApp failed with "Could not find Chrome". Pin the cache
    # inside the project, which IS preserved, and install the browser during
    # the build.
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: DATABASE_URL
        sync: false   # secret — set in the Render dashboard
      - key: JWT_SECRET
        sync: false   # secret — set in the Render dashboard
